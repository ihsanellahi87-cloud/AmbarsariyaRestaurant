<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ambarsariya Restaurant Lahore | Best Punjabi Food</title>

<meta name="description" content="Ambarsariya Restaurant Lahore - Authentic Punjabi food in Gulberg. Order hareesa, qeema naan, BBQ and more.">
<meta name="keywords" content="Ambarsariya Lahore, Punjabi food Lahore, desi restaurant Gulberg">
<meta name="author" content="Ambarsariya Restaurant">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff8f2;
}

/* NAV */
nav {
    background: #8b0000;
    color: white;
    display: flex;
    justify-content: space-between;
    padding: 15px 30px;
    position: sticky;
    top: 0;
}
nav a {
    color: white;
    margin-left: 15px;
    text-decoration: none;
}

/* HERO */
.hero {
    background: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092') center/cover;
    height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
}

/* SECTIONS */
section {
    padding: 50px 10%;
}

h2 {
    color: #8b0000;
}

/* MENU */
.menu {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 20px;
}
.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}
.card button {
    background: #8b0000;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    cursor: pointer;
}

/* GALLERY */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap: 10px;
}
.gallery img {
    width: 100%;
    border-radius: 10px;
}

/* CONTACT */
.contact {
    background: #8b0000;
    color: white;
    text-align: center;
}

/* CART */
.cart {
    position: fixed;
    right: 0;
    top: 0;
    width: 260px;
    height: 100%;
    background: white;
    padding: 15px;
    box-shadow: -3px 0 10px rgba(0,0,0,0.2);
}
.btn {
    background: #8b0000;
    color: white;
    padding: 10px;
    border: none;
    cursor: pointer;
    width: 100%;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<h2>Ambarsariya</h2>
<div>
<a href="#menu">Menu</a>
<a href="#gallery">Gallery</a>
<a href="#contact">Contact</a>
</div>
</nav>

<!-- HERO -->
<div class="hero">
<div>
<h1>Authentic Punjabi Taste</h1>
<p>Order your favorite food now</p>
<a href="https://wa.me/923138455354" target="_blank">
<button class="btn">Order on WhatsApp</button>
</a>
</div>
</div>

<!-- MENU -->
<section id="menu">
<h2>Menu</h2>

<div class="menu">

<div class="card">
<img src="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d">
<h3>Hareesa</h3>
<p>Rs 800</p>
<button onclick="addToCart('Hareesa',800)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1628294896516-79b0c6d4f7f5">
<h3>Qeema Naan</h3>
<p>Rs 400</p>
<button onclick="addToCart('Qeema Naan',400)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1603360946369-dc9bb6258143">
<h3>BBQ Platter</h3>
<p>Rs 1500</p>
<button onclick="addToCart('BBQ Platter',1500)">Add to Cart</button>
</div>

</div>
</section>

<!-- GALLERY -->
<section id="gallery">
<h2>Gallery</h2>

<div class="gallery">
<img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5">
<img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0">
<img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836">
</div>

</section>

<!-- CONTACT -->
<section id="contact" class="contact">
<h2>Contact</h2>
<p>📍 Mini Tower, Gulberg II, Lahore</p>
<p>📞 +92 313 8455354</p>
<p>⭐ Rated 4.6 on Google</p>
</section>

<!-- CART -->
<div class="cart">
<h3>🛒 Cart</h3>
<ul id="cartItems"></ul>
<h4 id="total">Total: Rs 0</h4>
<button class="btn" onclick="placeOrder()">Checkout</button>
</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price) {
    cart.push({name, price});
    total += price;
    renderCart();
}

function renderCart() {
    let list = document.getElementById("cartItems");
    list.innerHTML = "";
    cart.forEach(item => {
        let li = document.createElement("li");
        li.innerText = item.name + " - Rs " + item.price;
        list.appendChild(li);
    });
    document.getElementById("total").innerText = "Total: Rs " + total;
}

function placeOrder() {
    window.open("https://wa.me/923138455354?text=I want to order food. Total: Rs " + total);
}
</script>

</body>
</html>
